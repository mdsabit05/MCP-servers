<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Recipe & Pantry Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo { font-size: 32px; margin-bottom: 8px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
      background: #fafafa;
    }
    input:focus { border-color: #6366f1; background: #fff; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:disabled { background: #a5b4fc; cursor: not-allowed; }
    .footer { margin-top: 24px; text-align: center; font-size: 13px; color: #6b7280; }
    .footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
    .success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .success.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍳</div>
    <h1>Create account</h1>
    <p class="subtitle">Start managing your recipes and pantry</p>

    <div class="error" id="error-msg"></div>
    <div class="success" id="success-msg"></div>

    <form id="register-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Jane Smith" required autocomplete="name" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />

      <button type="submit" id="submit-btn">Create Account</button>
    </form>

    <div class="footer">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('submit-btn')
      const errEl = document.getElementById('error-msg')
      const successEl = document.getElementById('success-msg')
      errEl.classList.remove('visible')
      successEl.classList.remove('visible')
      btn.disabled = true
      btn.textContent = 'Creating account…'

      const name = document.getElementById('name').value
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      try {
        const res = await fetch('/api/auth/sign-up/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password }),
        })
        const data = await res.json()

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Registration failed')
        }

        successEl.textContent = 'Account created! Redirecting to sign in…'
        successEl.classList.add('visible')
        setTimeout(() => { window.location.href = '/login' }, 1500)
      } catch (err) {
        errEl.textContent = err.message
        errEl.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Create Account'
      }
    })
  </script>
</body>
</html>
