<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Recipe & Pantry Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .logo { font-size: 32px; margin-bottom: 8px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
      background: #fafafa;
    }
    input:focus { border-color: #6366f1; background: #fff; }
    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:disabled { background: #a5b4fc; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: #9ca3af; font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
    .github-btn {
      width: 100%;
      padding: 10px;
      background: #24292e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
      text-decoration: none;
    }
    .github-btn:hover { background: #1a1f24; }
    .footer { margin-top: 24px; text-align: center; font-size: 13px; color: #6b7280; }
    .footer a { color: #6366f1; text-decoration: none; font-weight: 600; }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍳</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your Recipe & Pantry Manager</p>

    <div class="error" id="error-msg"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />

      <button type="submit" id="submit-btn">Sign In</button>
    </form>

    <div class="divider">or</div>

    <a href="/api/auth/sign-in/social?provider=github&callbackURL=/auth-callback" class="github-btn" id="github-btn">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
      </svg>
      Continue with GitHub
    </a>

    <div class="footer">
      No account? <a href="/register">Create one</a>
    </div>
  </div>

  <script>
    // Pass through any OAuth query params (callbackURL, state, etc.)
    const params = new URLSearchParams(window.location.search)
    const callbackURL = params.get('callbackURL') || '/'

    // Update GitHub link to preserve OAuth flow
    const ghBtn = document.getElementById('github-btn')
    if (ghBtn && params.get('callbackURL')) {
      ghBtn.href = `/api/auth/sign-in/social?provider=github&callbackURL=${encodeURIComponent(callbackURL)}`
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('submit-btn')
      const errEl = document.getElementById('error-msg')
      errEl.classList.remove('visible')
      btn.disabled = true
      btn.textContent = 'Signing in…'

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value

      try {
        const res = await fetch('/api/auth/sign-in/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, callbackURL }),
        })
        const data = await res.json()

        if (!res.ok) {
          throw new Error(data.message || data.error || 'Sign in failed')
        }

        // Redirect — better-auth handles the OAuth flow continuation
        window.location.href = callbackURL
      } catch (err) {
        errEl.textContent = err.message
        errEl.classList.add('visible')
        btn.disabled = false
        btn.textContent = 'Sign In'
      }
    })
  </script>
</body>
</html>
